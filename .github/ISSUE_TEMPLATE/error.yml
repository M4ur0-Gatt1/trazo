name: Informar de un error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Para fallos de seguridad no uses este formulario: sigue [SECURITY.md](https://github.com/M4ur0-Gatt1/trazo/blob/main/SECURITY.md).
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas que ocurriera y qué ocurrió en realidad.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Crear un lienzo de 2048 × 2048
        2. Elegir el pincel Óleo
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Trazo
      description: Acciones › Acerca de Trazo
      placeholder: "1.0.0 (399ed9c)"
    validations:
      required: true
  - type: dropdown
    id: origen
    attributes:
      label: Dónde la instalaste
      options:
        - Instalador de GitHub (.exe)
        - Versión portable (.zip)
        - Microsoft Store
        - Compilada desde el código
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: equipo
    attributes:
      label: Equipo, lápiz y tarjeta gráfica
      placeholder: "Surface Pro 9 con Slim Pen 2, Intel Iris Xe"
  - type: textarea
    id: registro
    attributes:
      label: Registro
      description: En Acerca de Trazo › «Abrir la carpeta de registros», adjunta el archivo más reciente o pega las líneas del error.
      render: text
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o archivo
      description: Arrastra aquí una captura o, si el problema es con un proyecto, el archivo .trazo.
