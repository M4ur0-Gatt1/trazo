name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (núcleo + renderizado WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # EX-01.8: ag-psd (versión fijada en package-lock.json) para la verificación cruzada del PSD
      - name: Herramienta de verificación PSD
        run: npm ci --no-audit --no-fund
        working-directory: tools/psd-interop
      - name: Núcleo (BR-01, FI-01, EX-01, historial, formato)
        env:
          TRAZO_REQUIRE_INTEROP: '1'
        run: dotnet test tests/Trazo.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory test-results
      - name: Renderizado (BR-02, LY-01) con Direct3D WARP
        run: dotnet test tests/Trazo.Rendering.Tests -c Release --logger "trx;LogFileName=rendering.trx" --results-directory test-results
      - name: Conservar métricas e imágenes resultantes
        if: always()
        shell: pwsh
        run: Copy-Item tests/Trazo.Rendering.Tests/bin/*/Release/*/*/results -Destination test-results/rendering -Recurse -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  build:
    name: Compilar app (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Trazo.App -c Release -p:Platform=${{ matrix.platform }}

  msix:
    name: Paquete MSIX para la Store (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # comprueba que el manifiesto y los logos siguen siendo válidos (identidad de desarrollo)
      - run: ./tools/build-msix.ps1 -Version 1.0.0 -Arch x64
        shell: pwsh

  bench:
    name: Rendimiento (WARP, informativo)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # WARP no es una GPU: las cifras sirven para ver tendencias, no deciden (PF-01)
      - run: dotnet run --project tools/Trazo.Benchmarks -c Release -p:Platform=x64 -- --warp --quick --out bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendimiento-warp
          path: bench
