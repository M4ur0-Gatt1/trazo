name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pruebas del núcleo
        if: matrix.platform == 'x64'
        run: dotnet test tests/Trazo.Core.Tests -c Release
      - name: Compilar la app
        run: dotnet build src/Trazo.App -c Release -p:Platform=${{ matrix.platform }}
