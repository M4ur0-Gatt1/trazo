name: Release

# Publica los instaladores al crear una etiqueta vX.Y.Z (o vX.Y.Z-beta.N como pre-release)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Trazo.Core.Tests -c Release
      - run: dotnet test tests/Trazo.Rendering.Tests -c Release

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Versión
        id: v
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          "version=$tag" >> $env:GITHUB_OUTPUT
          # versión numérica para el ensamblado (sin el sufijo -beta.N)
          "numeric=$($tag.Split('-')[0])" >> $env:GITHUB_OUTPUT
      - name: Publicar
        run: dotnet publish src/Trazo.App -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -p:Version=${{ steps.v.outputs.numeric }} -p:InformationalVersion=${{ steps.v.outputs.version }} -o artifacts/publish/win-${{ matrix.arch }}
      - name: Instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ steps.v.outputs.version }} /DArch=${{ matrix.arch }} /DSourceDir=..\artifacts\publish\win-${{ matrix.arch }} installer\Trazo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path artifacts/publish/win-${{ matrix.arch }}/* -DestinationPath artifacts/installer/Trazo-${{ steps.v.outputs.version }}-${{ matrix.arch }}-portable.zip
          # las sumas se calculan antes de escribir el .txt (si no, el archivo se lista a sí mismo y queda bloqueado)
          $sums = Get-ChildItem artifacts/installer -File | Where-Object Extension -ne '.txt' |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content artifacts/installer/SHA256-${{ matrix.arch }}.txt -Value $sums -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/installer/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: installer/RELEASE_NOTES.md
          generate_release_notes: true
