# Avisos semanales de dependencias nuevas (NuGet y acciones de GitHub).
# Cada actualización llega como pull request y pasa por la CI completa antes de aceptarse.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      windows-sdk:
        patterns: ["Microsoft.WindowsAppSDK*", "Microsoft.Windows.SDK.BuildTools*", "Microsoft.Graphics.Win2D"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tools/psd-interop
    schedule:
      interval: weekly
    # solo se usa en las pruebas (EX-01.8); se deja madurar dos semanas antes de proponer una versión nueva
    cooldown:
      default-days: 14
